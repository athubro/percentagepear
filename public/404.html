<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>PercentagePear</title>
    <script>
      // spa-github-pages (https://github.com/rafgraph/spa-github-pages):
      // GitHub Pages has no SPA fallback, so deep links like /percentagepear/dashboard
      // hit this 404 page. Redirect to index.html while preserving the path in the
      // query string; index.html then restores the clean URL for vue-router.
      //
      // Number of path segments to keep for the site root — 1 for a project page
      // (username.github.io/percentagepear/), 0 for a user/organization site.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
